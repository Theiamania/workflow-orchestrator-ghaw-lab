name: WOGHAW E-04M mitigation probe (deterministic, no AI)
on:
  push:
    branches: [woghaw-e04m-probe]
permissions: {}
concurrency:
  group: woghaw-e04m-probe
  cancel-in-progress: false
jobs:
  proposals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .wo
      - name: stage g09_valid_1_of_1
        run: mkdir -p out/g09_valid_1_of_1 && cp .wo/fixtures/valid_issue_1.json out/g09_valid_1_of_1/agent_output.json
      - name: stage raw g09_valid_1_of_1
        run: cp .wo/fixtures/valid_issue_1.jsonl out/g09_valid_1_of_1/safeoutputs.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-g09_valid_1_of_1
          path: out/g09_valid_1_of_1/*
      - name: stage g09_e04c_2_of_1
        run: mkdir -p out/g09_e04c_2_of_1 && cp .wo/fixtures/e04c_issue_2.json out/g09_e04c_2_of_1/agent_output.json
      - name: stage raw g09_e04c_2_of_1
        run: cp .wo/fixtures/e04c_issue_2.jsonl out/g09_e04c_2_of_1/safeoutputs.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-g09_e04c_2_of_1
          path: out/g09_e04c_2_of_1/*
      - name: stage fc_malformed
        run: mkdir -p out/fc_malformed && cp .wo/fixtures/malformed.json out/fc_malformed/agent_output.json
      - name: stage raw fc_malformed
        run: cp .wo/fixtures/malformed.jsonl out/fc_malformed/safeoutputs.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-fc_malformed
          path: out/fc_malformed/*
      - name: stage fc_unknown_type
        run: mkdir -p out/fc_unknown_type && cp .wo/fixtures/unknown_type.json out/fc_unknown_type/agent_output.json
      - name: stage raw fc_unknown_type
        run: cp .wo/fixtures/unknown_type.jsonl out/fc_unknown_type/safeoutputs.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-fc_unknown_type
          path: out/fc_unknown_type/*
      - name: stage fc_missing_policy
        run: mkdir -p out/fc_missing_policy && cp .wo/fixtures/valid_issue_1.json out/fc_missing_policy/agent_output.json
      - name: stage raw fc_missing_policy
        run: cp .wo/fixtures/valid_issue_1.jsonl out/fc_missing_policy/safeoutputs.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-fc_missing_policy
          path: out/fc_missing_policy/*
      - name: stage fc_policy_parse
        run: mkdir -p out/fc_policy_parse && cp .wo/fixtures/valid_issue_1.json out/fc_policy_parse/agent_output.json
      - name: stage raw fc_policy_parse
        run: cp .wo/fixtures/valid_issue_1.jsonl out/fc_policy_parse/safeoutputs.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-fc_policy_parse
          path: out/fc_policy_parse/*
      - name: stage fc_missing_credential
        run: mkdir -p out/fc_missing_credential && cp .wo/fixtures/valid_issue_1.json out/fc_missing_credential/agent_output.json
      - name: stage raw fc_missing_credential
        run: cp .wo/fixtures/valid_issue_1.jsonl out/fc_missing_credential/safeoutputs.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-fc_missing_credential
          path: out/fc_missing_credential/*
      - name: stage fc_ambiguous_target
        run: mkdir -p out/fc_ambiguous_target && cp .wo/fixtures/ambiguous_target.json out/fc_ambiguous_target/agent_output.json
      - name: stage raw fc_ambiguous_target
        run: cp .wo/fixtures/ambiguous_target.jsonl out/fc_ambiguous_target/safeoutputs.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-fc_ambiguous_target
          path: out/fc_ambiguous_target/*
      - name: stage g09_collector_dropped
        run: mkdir -p out/g09_collector_dropped && cp .wo/fixtures/collector_dropped.json out/g09_collector_dropped/agent_output.json
      - name: stage raw g09_collector_dropped
