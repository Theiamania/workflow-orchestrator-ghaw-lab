          name: agent-fc_ambiguous_target
          path: out/fc_ambiguous_target/agent_output.json
  detection_g09_valid_1_of_1:
    needs: [proposals]
    if: always() && needs.proposals.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download agent output artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agent-g09_valid_1_of_1
          path: /tmp/gh-aw/
      - name: WO effect admission checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: _wo_gate
          sparse-checkout: .wo
          persist-credentials: false
      - name: WO effect admission
        id: wo_effect_admission
        if: always()
        run: python3 _wo_gate/.wo/wo_effect_admission.py admit _wo_gate/.wo/policy_issue.json /tmp/gh-aw/agent_output.json | tee /tmp/decision.json; exit ${PIPESTATUS[0]}
      - name: publish decision
        if: always()
        run: echo "::notice title=WO_DECISION g09_valid_1_of_1::$(python3 -c 'import json;d=json.load(open("/tmp/decision.json"));print(d["decision"], d["reasons"][:2])' 2>&1)"
  executor_g09_valid_1_of_1:
    needs: [proposals, detection_g09_valid_1_of_1]
