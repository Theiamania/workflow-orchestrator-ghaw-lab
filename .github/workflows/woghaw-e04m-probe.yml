  g06_pr_executor_least_privilege:
    needs: [proposals]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const r = (await github.rest.repos.get({owner, repo})).data;
            core.notice(`has_issues=${r.has_issues}`, {title: 'REPO_STATE'});
            try {
              const res = await github.rest.issues.create({owner, repo, title: '[woghaw-e04m] fallback-issue probe (must be rejected)', body: 'deterministic probe', labels: []});
              core.error(`ISSUE_CREATED #${res.data.number}`, {title: 'ISSUE_EFFECT_MATERIALISED'});
              core.setFailed('issue created');
            } catch (e) {
              const h = (e.response && e.response.headers) || {};
              core.notice(JSON.stringify({status: e.status, message: e.message, accepted_permissions: h['x-accepted-github-permissions'] || null}), {title: 'ISSUE_CREATE_REJECTED'});
            }
            const pr = await github.rest.pulls.create({owner, repo, head: 'woghaw-e04m-probe', base: 'main', draft: true,
              title: '[woghaw-e04m] least-privilege PR executor probe (auto-closed)', body: 'Deterministic probe: PR creation with contents+pull-requests write and NO issues permission. Closed immediately.'});
            core.notice(`created PR #${pr.data.number} head=${pr.data.head.sha}`, {title: 'PR_CREATED_WITHOUT_ISSUES_PERMISSION'});
            const cl = await github.rest.pulls.update({owner, repo, pull_number: pr.data.number, state: 'closed'});
            core.notice(`PR #${cl.data.number} state=${cl.data.state}`, {title: 'PR_CLOSED'});
  g06_control_issues_writer:
    needs: [proposals]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const r = (await github.rest.repos.get({owner, repo})).data;
            if (r.has_issues) { core.setFailed('Issues enabled: control would create a real issue; aborting'); return; }
            try {
              const res = await github.rest.issues.create({owner, repo, title: '[woghaw-e04m] fallback-issue probe (must be rejected)', body: 'deterministic probe', labels: []});
              core.error(`ISSUE_CREATED #${res.data.number}`, {title: 'ISSUE_EFFECT_MATERIALISED'});
