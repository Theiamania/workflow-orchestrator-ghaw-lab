    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agent-g09_valid_1_of_1
          path: /tmp/gh-aw/
      - name: spy executor (no token, no API call)
        run: echo "::notice title=EXECUTOR_REACHED g09_valid_1_of_1::would execute $(python3 -c 'import json;print(len([i for i in json.load(open("/tmp/gh-aw/agent_output.json"))["items"]]))') item(s)"
