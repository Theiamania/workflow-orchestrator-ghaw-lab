# WOGHAW E-06 dispatcher — INSTRUMENTAL_TRIGGER_EXCEPTION (D10) + ACK_LOSS_FAULT_INJECTION. No agent, no provider secret.
# Exactly one real createWorkflowDispatch for identity A. The HTTP response (status and body) is deliberately
# discarded: nothing about it is printed, annotated, stored or returned, and the job always ends in success, so
# the job conclusion carries no acknowledgement either. WO is left in DISPATCH_UNKNOWN.
# Identity B is deliberately NOT dispatched (it appears nowhere in this workflow's calls).
name: WOGHAW E-06 dispatcher
on:
  push:
    branches: [woghaw-e06-dispatch]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: createWorkflowDispatch A (exactly once, response discarded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/woghaw-e06-target.yml/dispatches" \
            -d '{"ref":"woghaw-phase2-targets","inputs":{"wo_dispatch_id":"WOD-E06-A-8862a209b239"}}' > /dev/null 2>&1 || true
          exit 0
